# =============================================================================
# backend/pixi.toml — Pixi package manifest for the backend conda package.
#
# This file is used exclusively by `pixi build` (via the pixi-build preview
# feature) to produce a conda package (.conda / .tar.bz2) that is uploaded
# to GitHub releases.
#
# It is separate from backend/pyproject.toml (which keeps hatchling as its
# build backend for pip / Docker / editable installs).  pixi-build-python
# internally calls hatchling to build the Python wheel and then wraps it into
# a conda package.
#
# Usage:
#   pixi build --manifest-path backend/pixi.toml --output-dir dist/backend
# =============================================================================

[package]
name    = "idp-app"
version = "0.1.0"

[package.build-system]
name    = "pixi-build-python"
version = ">=0.1.0"

# ---------------------------------------------------------------------------
# Host dependencies — available during the build step only
# ---------------------------------------------------------------------------
[package.host-dependencies]
python    = ">=3.12,<3.14"
hatchling = ">=1.24.0"

# ---------------------------------------------------------------------------
# Run dependencies — installed alongside the package in the target environment.
# Must use conda-forge package names (no PyPI extras notation).
# ---------------------------------------------------------------------------
[package.run-dependencies]
python           = ">=3.12,<3.14"
fastapi          = ">=0.115.0,<1"
uvicorn          = ">=0.32.0,<1"
httptools        = ">=0.6.0"        # uvicorn[standard]: faster HTTP parsing
websockets       = ">=13.0"         # uvicorn[standard]: WebSocket support
sqlalchemy       = ">=2.0.0,<3"
alembic          = ">=1.14.0,<2"
celery           = ">=5.4.0,<6"
redis-py         = ">=5.2.0,<6"    # celery[redis]: Celery broker & result backend
psycopg2         = ">=2.9.0,<3"
pydantic         = ">=2.10.0,<3"
pydantic-settings = ">=2.6.0,<3"
python-multipart = ">=0.0.12"
python-jose      = ">=3.3.0,<4"
cryptography     = ">=43.0.0"       # python-jose[cryptography]: JWT signing
passlib          = ">=1.7.4,<2"
bcrypt           = ">=4.2.0,<5"     # passlib[bcrypt]: password hashing
httpx            = ">=0.27.0,<1"
