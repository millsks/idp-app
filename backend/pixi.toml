# =============================================================================
# backend/pixi.toml — Pixi package manifest for the backend conda package.
#
# This is a pixi PACKAGE MANIFEST, not general pixi configuration.
# All environments, tasks, and dependencies live in the root pixi.toml.
#
# Pixi's workspace model requires that the [package] declaration lives in the
# same directory as the pyproject.toml it wraps — it cannot be inlined into
# the root pixi.toml for a sub-directory package.
#
# pixi-build-python calls hatchling (declared in backend/pyproject.toml)
# to build the Python wheel, then wraps it into a conda package (.conda).
#
# Usage (invoked by the root `pixi run backend-build` task):
#   pixi publish --path backend/pixi.toml --target-dir dist/backend
# =============================================================================

[package]
name    = "idp-app"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = ">=0.1.0" }

# ---------------------------------------------------------------------------
# Host dependencies — available during the build step only
# ---------------------------------------------------------------------------
[package.host-dependencies]
python    = ">=3.12,<3.14"
hatchling = ">=1.24.0"

# ---------------------------------------------------------------------------
# Run dependencies — installed alongside the package in the target environment.
# Must use conda-forge package names (no PyPI extras notation).
# ---------------------------------------------------------------------------
[package.run-dependencies]
python            = ">=3.12,<3.14"
fastapi           = ">=0.115.0,<1"
uvicorn           = ">=0.32.0,<1"
httptools         = ">=0.6.0"        # uvicorn[standard]: faster HTTP parsing
websockets        = ">=13.0"         # uvicorn[standard]: WebSocket support
sqlalchemy        = ">=2.0.0,<3"
alembic           = ">=1.14.0,<2"
celery            = ">=5.4.0,<6"
redis-py          = ">=5.2.0,<6"    # celery[redis]: Celery broker & result backend
psycopg2          = ">=2.9.0,<3"
asyncpg           = ">=0.30.0,<1"    # async PostgreSQL driver for SQLAlchemy
pydantic          = ">=2.10.0,<3"
pydantic-settings = ">=2.6.0,<3"
python-multipart  = ">=0.0.12"
python-jose       = ">=3.3.0,<4"
cryptography      = ">=43.0.0"       # python-jose[cryptography]: JWT signing
passlib           = ">=1.7.4,<2"
bcrypt            = ">=4.2.0,<5"     # passlib[bcrypt]: password hashing
httpx             = ">=0.27.0,<1"
