# .pre-commit-config.yaml — pre-commit hooks for the IDP App monorepo.
#
# Setup:  pixi run setup          (installs hooks + msg hook + frontend deps)
# Run:    pixi run hooks-run       (run all hooks against every file)
# Update: pixi run hooks-update    (update hook versions to latest)
#
# Docs: https://pre-commit.com

default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # General file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # JSONC files (allow comments)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: \.secrets\.example$
      - id: debug-statements       # catch leftover breakpoint() / pdb calls
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------------------
  # Conventional Commits — commit message linting (commit-msg stage)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # ---------------------------------------------------------------------------
  # Backend — Python (runs only on files under backend/)
  # ---------------------------------------------------------------------------

  # Ruff: linting + auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff (lint + fix) — backend
        args: [--fix, --config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        name: ruff-format — backend
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  # MyPy: type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        name: mypy — backend
        args: [--config-file, backend/pyproject.toml]
        files: ^backend/src/
        pass_filenames: false
        additional_dependencies:
          - fastapi
          - sqlalchemy[mypy]
          - pydantic
          - pydantic-settings
          - python-jose
          - passlib
          - httpx
          - pytest
          - pytest-asyncio
          - types-passlib
          - types-redis
          - types-python-jose

  # Bandit: security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit — backend
        args: [-r, backend/src, -ll, --configfile, backend/pyproject.toml]
        files: ^backend/src/
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Frontend — JavaScript / TypeScript (runs only on files under frontend/)
  # ---------------------------------------------------------------------------

  # Prettier: formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier — frontend
        files: ^frontend/src/
        types_or: [javascript, jsx, ts, tsx, css, json]
        additional_dependencies:
          - prettier@^3.5.0

  # ESLint: linting (via local node_modules to pick up project config)
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint — frontend
        language: node
        entry: sh -c 'cd frontend && node_modules/.bin/eslint --max-warnings=0'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        additional_dependencies: []

  # TypeScript: type checking
  - repo: local
    hooks:
      - id: tsc-frontend
        name: tsc — frontend
        language: node
        entry: sh -c 'cd frontend && node_modules/.bin/tsc --noEmit'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        additional_dependencies: []
