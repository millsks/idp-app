# SonarCloud configuration for idp-app
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project identification
sonar.projectKey=millsks_idp-app
sonar.organization=millsks

# Project metadata
sonar.projectName=idp-app
sonar.projectVersion=0.1.0

# Source code settings (monorepo — backend Python + frontend TypeScript)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

# Python-specific settings
sonar.python.version=3.12,3.13

# Coverage settings
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.coverage.exclusions=backend/tests/**,frontend/src/test/**

# Test settings
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Exclude files from analysis
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  .pixi/**,\
  .pytest_cache/**,\
  **/node_modules/**,\
  frontend/dist/**,\
  backend/alembic/**,\
  _bmad-output/**,\
  _bmad/**,\
  .agents/**,\
  .claude/**,\
  docker/**

# Language-specific source encoding
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript settings
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
