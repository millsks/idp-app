name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, type-check, security, test
  # ---------------------------------------------------------------------------
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.47.0
          cache: true

      - name: Lint with ruff
        run: pixi run backend-lint

      - name: Check formatting with ruff
        run: pixi run backend-format-check

      - name: Type check with mypy
        run: pixi run backend-typecheck

      - name: Security scan with bandit
        run: pixi run backend-security

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality

    services:
      # Provide a real PostgreSQL for integration tests (optional — tests use SQLite by default)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: idp_test_db
          POSTGRES_USER: idp_test_user
          POSTGRES_PASSWORD: idp_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.47.0
          cache: true

      - name: Run backend tests
        run: pixi run backend-test
        env:
          DATABASE_URL: postgresql://idp_test_user:idp_test_password@localhost:5432/idp_test_db

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Frontend: lint, type-check, security, test
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (for Node.js)
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.47.0
          cache: true

      - name: Install frontend dependencies
        run: pixi run frontend-install-ci

      - name: Lint with ESLint
        run: pixi run frontend-lint

      - name: Check formatting with Prettier
        run: pixi run frontend-format-check

      - name: Type check with tsc
        run: pixi run frontend-typecheck

      - name: Security audit
        run: pixi run frontend-security
        continue-on-error: true  # advisory only; update as needed

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (for Node.js)
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.47.0
          cache: true

      - name: Install frontend dependencies
        run: pixi run frontend-install-ci

      - name: Run tests with coverage
        run: pixi run frontend-test-coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Docker: build images (validates Dockerfiles)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: idp-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: idp-frontend:ci
