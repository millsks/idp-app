name: Repository Maintenance

# The `update-dependencies` job that previously ran `pixi update` and `npm update`
# here has been removed. Renovate (configured in .github/renovate.json) now owns
# all dependency updates and lock-file regeneration. Keeping both would cause
# merge conflicts on pixi.lock and frontend/package-lock.json.
#
# Remaining jobs:
#   cleanup-artifacts — deletes old workflow runs to keep the Actions tab clean.
#   security-audit    — generates artifact reports (bandit JSON + npm audit JSON)
#                       for offline review. Complementary to Renovate's OSV-based
#                       vulnerability PRs; these produce the raw audit trail.

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly on Sundays at 2 AM UTC
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    name: Cleanup Old Workflow Runs
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.69.0

      - name: Backend security scan (bandit)
        run: pixi run backend-security-report

      - name: Frontend security audit
        run: |
          pixi run frontend-install-ci
          cd frontend && npm audit --json > npm-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            frontend/npm-audit-report.json
          retention-days: 30
